<canvas id="shader-canvas-ANIMATION_7" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_7');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

float noise(vec2 p) {
    return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}

void main() {
    vec2 uv = v_texCoord;
    vec2 center = uv - 0.5;
    center.x *= u_resolution.x / u_resolution.y;
    
    // Deep OLED base
    vec3 color = vec3(0.039, 0.055, 0.09); // #0A0E17
    
    // Electric Blue Glow Nebula
    float dist = length(center);
    float glow = 0.05 / (dist + 0.5);
    
    vec2 m = u_mouse / u_resolution;
    vec2 shift = vec2(sin(u_time * 0.2), cos(u_time * 0.15)) * 0.1;
    float nebula = 0.0;
    for(float i = 1.0; i < 4.0; i++) {
        vec2 p = center * i + shift + (m - 0.5) * 0.2;
        nebula += noise(p + u_time * 0.05 * i) / i;
    }
    
    vec3 blueGlow = vec3(0.039, 0.518, 1.0) * nebula * 0.4; // #0A84FF
    color += blueGlow * (1.0 - dist);
    
    // Subtle amber highlights
    float amber = smoothstep(0.6, 0.0, length(center - vec2(0.4, -0.3)));
    color += vec3(0.96, 0.62, 0.04) * amber * 0.05; // #F59E0B
    
    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();

<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_8" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_8');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Crystal Geometry (Octahedron + Icosahedron blend)
const crystalGeom = new THREE.IcosahedronGeometry(1.5, 0);
const crystalMat = new THREE.MeshPhongMaterial({
    color: 0x0A84FF,
    emissive: 0x0A84FF,
    emissiveIntensity: 0.5,
    transparent: true,
    opacity: 0.8,
    shininess: 100,
    flatShading: true
});
const crystal = new THREE.Mesh(crystalGeom, crystalMat);
scene.add(crystal);

// Orbiting Rings
const rings = [];
const ringData = [
    { radius: 2.2, color: 0x0A84FF, speed: 0.01, axis: 'z' }, // Deploy
    { radius: 2.8, color: 0xF59E0B, speed: 0.007, axis: 'y' }, // Uptime
    { radius: 3.4, color: 0x0A84FF, speed: 0.005, axis: 'x' }  // Errors
];

ringData.forEach(data => {
    const geom = new THREE.TorusGeometry(data.radius, 0.02, 16, 100);
    const mat = new THREE.MeshBasicMaterial({ color: data.color, transparent: true, opacity: 0.6 });
    const ring = new THREE.Mesh(geom, mat);
    ring.rotation.x = Math.random() * Math.PI;
    ring.rotation.y = Math.random() * Math.PI;
    scene.add(ring);
    rings.push({ mesh: ring, speed: data.speed, axis: data.axis });
});

// Particles
const particlesGeom = new THREE.BufferGeometry();
const particlesCount = 200;
const posArray = new Float32Array(particlesCount * 3);
for(let i=0; i < particlesCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 10;
}
particlesGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
const particlesMat = new THREE.PointsMaterial({ size: 0.02, color: 0xFFFFFF, transparent: true, opacity: 0.5 });
const particlesMesh = new THREE.Points(particlesGeom, particlesMat);
scene.add(particlesMesh);

camera.position.z = 6;

function animate() {
    requestAnimationFrame(animate);
    
    crystal.rotation.y += 0.005;
    crystal.rotation.z += 0.002;
    
    rings.forEach(r => {
        r.mesh.rotation[r.axis] += r.speed;
    });
    
    particlesMesh.rotation.y += 0.001;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
